<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low Vision Games</title>
  <meta name="theme-color" content="#000000">
  <style>
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700;
      src: url("word-guess/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
    :root { --bg: #000; --fg: #ffe600; --card: #1d1d1d; --line: #7a7a7a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: "Atkinson Hyperlegible", -apple-system, Arial, sans-serif; font-weight: 700;
      padding: 24px 16px; }
    h1 { text-align: center; font-size: clamp(40px, 7vw, 72px); margin: 0 0 32px; }
    .apps { display: grid; gap: 24px; max-width: 900px; margin: 0 auto; }
    a.app { display: flex; align-items: center; gap: 28px; padding: 24px; background: var(--card);
      border: 4px solid var(--line); border-radius: 24px; color: inherit; text-decoration: none;
      font-size: clamp(36px, 6vw, 60px); }
    a.app img { width: clamp(96px, 16vw, 160px); height: auto; border-radius: 20px; }
  </style>
</head>
<body>
  <h1>Games</h1>
  <div class="apps">
    <a class="app" href="word-guess/"><img src="word-guess/icon-512.png" alt="">Word Guess</a>
  </div>
</body>
</html>
